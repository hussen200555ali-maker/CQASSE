<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CQASSE Test</title>
<link rel="stylesheet" href="assets/css/all.min.css">
<link rel="stylesheet" href="assets/css/login.css">
</head>
<body>
<div class="version-bar"><span class="version-badge">v4.0.0</span></div>
<div class="login-wrapper">
<div class="login-container">
<div class="login-main">
<div class="login-brand">
<img src="assets/img/logo-login.svg" alt="CQASSE" class="login-seal" width="100" height="100">
<h1 class="login-title">نظام التقييم الشامل</h1>
<p class="login-subtitle">لجودة التعليم المدرسي</p>
<div class="brand-divider"></div>
</div>
<form class="login-form">
<div class="form-group">
<label class="form-label">المستخدم</label>
<div class="input-wrap">
<input class="form-control" placeholder="اسم المستخدم">
<i class="fas fa-user input-icon"></i>
</div>
</div>
<div class="form-group">
<label class="form-label">كلمة المرور</label>
<div class="input-wrap">
<input class="form-control" type="password" placeholder="كلمة المرور">
<i class="fas fa-lock input-icon"></i>
</div>
</div>
<button class="login-btn" type="submit"><span class="btn-text">دخول</span></button>
</form>
</div>
<div class="standards-panel">
<div class="standards-header"><i class="fas fa-ruler-combined"></i><span>المعايير</span></div>
<div class="standards-list">
<div class="standard-item"><div class="std-top"><span class="std-icon"><i class="fas fa-graduation-cap"></i></span><span class="std-name">أكاديمي</span><span class="std-pct">35%</span></div></div>
<div class="standard-item"><div class="std-top"><span class="std-icon"><i class="fas fa-chalkboard"></i></span><span class="std-name">تدريس</span><span class="std-pct">25%</span></div></div>
<div class="standard-item"><div class="std-top"><span class="std-icon"><i class="fas fa-school"></i></span><span class="std-name">مناخ</span><span class="std-pct">15%</span></div></div>
<div class="standard-item"><div class="std-top"><span class="std-icon"><i class="fas fa-star"></i></span><span class="std-name">سلوك</span><span class="std-pct">10%</span></div></div>
<div class="standard-item"><div class="std-top"><span class="std-icon"><i class="fas fa-bullseye"></i></span><span class="std-name">مهارات</span><span class="std-pct">10%</span></div></div>
<div class="standard-item"><div class="std-top"><span class="std-icon"><i class="fas fa-calendar-check"></i></span><span class="std-name">حضور</span><span class="std-pct">5%</span></div></div>
</div>
</div>
</div>
<div class="tagline-bar"><span class="tagline-text">يكشف الحقيقة ♦ يبني الواقع ♦ يرتقي بالتعليم</span></div>
</div>
</body>
</html>
