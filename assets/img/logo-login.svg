<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <!-- Definitions for gradients and filters -->
  <defs>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8a951"/>
      <stop offset="100%" stop-color="#d9c47a"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a5632"/>
      <stop offset="100%" stop-color="#0f3a20"/>
    </linearGradient>
    <linearGradient id="goldFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8a951" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c8a951" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Outer decorative ring -->
  <circle cx="80" cy="80" r="78" stroke="url(#ringGrad)" stroke-width="2.5" opacity="0.8"/>
  <circle cx="80" cy="80" r="73" stroke="#c8a951" stroke-width="0.5" opacity="0.3"/>

  <!-- Decorative dots on ring (top, right, bottom, left) -->
  <circle cx="80" cy="4" r="3" fill="#c8a951" opacity="0.8"/>
  <circle cx="156" cy="80" r="3" fill="#c8a951" opacity="0.8"/>
  <circle cx="80" cy="156" r="3" fill="#c8a951" opacity="0.8"/>
  <circle cx="4" cy="80" r="3" fill="#c8a951" opacity="0.8"/>

  <!-- Laurel leaves (left) -->
  <path d="M28 100 Q15 80 22 55 Q28 70 32 82 Q36 72 42 60 Q38 78 34 92 Q40 85 48 78 Q40 95 28 100Z" fill="url(#goldFade)" opacity="0.5"/>
  <!-- Laurel leaves (right) -->
  <path d="M132 100 Q145 80 138 55 Q132 70 128 82 Q124 72 118 60 Q122 78 126 92 Q120 85 112 78 Q120 95 132 100Z" fill="url(#goldFade)" opacity="0.5"/>

  <!-- Inner circle background -->
  <circle cx="80" cy="82" r="58" fill="url(#bgGrad)"/>
  <circle cx="80" cy="82" r="58" stroke="#c8a951" stroke-width="1.5" opacity="0.4"/>

  <!-- Measurement grid lines (subtle background pattern) -->
  <g opacity="0.08">
    <line x1="30" y1="55" x2="130" y2="55" stroke="white" stroke-width="0.5"/>
    <line x1="30" y1="65" x2="130" y2="65" stroke="white" stroke-width="0.5"/>
    <line x1="30" y1="75" x2="130" y2="75" stroke="white" stroke-width="0.5"/>
    <line x1="30" y1="85" x2="130" y2="85" stroke="white" stroke-width="0.5"/>
    <line x1="30" y1="95" x2="130" y2="95" stroke="white" stroke-width="0.5"/>
    <line x1="30" y1="105" x2="130" y2="105" stroke="white" stroke-width="0.5"/>
  </g>

  <!-- Open Book (center) -->
  <path d="M55 72 L55 50 Q67 54 80 56 L80 78 Q67 76 55 72Z" fill="white" opacity="0.95"/>
  <path d="M105 72 L105 50 Q93 54 80 56 L80 78 Q93 76 105 72Z" fill="white" opacity="0.9"/>
  <!-- Book spine -->
  <line x1="80" y1="56" x2="80" y2="78" stroke="#1a5632" stroke-width="1.2" opacity="0.4"/>

  <!-- Checkmark (golden, right page) -->
  <path d="M90 62 L96 70 L108 56" fill="none" stroke="#c8a951" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Star (education quality) -->
  <polygon points="63,59 65,65 71,65 66,69 68,75 63,71 58,75 60,69 55,65 61,65" fill="#c8a951" opacity="0.9"/>

  <!-- Measurement bars (horizontal, below book) -->
  <g opacity="0.6">
    <rect x="45" y="86" width="70" height="2.5" rx="1" fill="#c8a951" opacity="0.5"/>
    <rect x="50" y="91" width="60" height="2" rx="1" fill="#c8a951" opacity="0.35"/>
    <rect x="55" y="95" width="50" height="1.5" rx="1" fill="#c8a951" opacity="0.25"/>
  </g>

  <!-- EQAS Text -->
  <text x="80" y="114" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="8" fill="#c8a951" letter-spacing="2">CQASSE</text>

  <!-- Small decorative dots around seal -->
  <circle cx="80" cy="18" r="1.5" fill="#c8a951" opacity="0.4"/>
  <circle cx="142" cy="80" r="1.5" fill="#c8a951" opacity="0.4"/>
  <circle cx="80" cy="146" r="1.5" fill="#c8a951" opacity="0.4"/>
  <circle cx="18" cy="80" r="1.5" fill="#c8a951" opacity="0.4"/>
</svg>
